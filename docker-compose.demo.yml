# Демо-стенд https://checkstock.proleadly.com
#
# Отличия от docker-compose.yml (локальной разработки):
#   - приложение публикуется только на 127.0.0.1 (наружу — через nginx с Basic Auth);
#   - у базы нет внешнего порта вообще;
#   - отдельное имя compose-проекта, чтобы не пересечься с другими стеками на сервере;
#   - ограничение памяти и автоперезапуск.
#
# Запуск на сервере (из /docker/checkstock, рядом лежит .env):
#   docker compose -f docker-compose.demo.yml up -d --build
#   curl -fsS http://127.0.0.1:8010/health

name: checkstock

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-checkstock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkstock} -d ${POSTGRES_DB:-checkstock}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        # В демо-образе нужен httpx для scripts/verify_flow.py.
        INSTALL_DEV: "true"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    # 8000 на сервере занят waBot, поэтому демо слушает 8010 строго на localhost.
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
